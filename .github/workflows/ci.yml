name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify technical baseline
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://restgest_ci:ci-only-password@localhost:5432/restgest_ci?schema=public
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: restgest_ci
          POSTGRES_USER: restgest_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restgest_ci -d restgest_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace api

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Run API end-to-end test
        run: npm run test:e2e
